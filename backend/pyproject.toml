[project]
name = "backend"
version = "0.1.0"
description = "Musiknot API backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.34.0",
    "requests==2.33.1",
    "beautifulsoup4==4.14.3",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.0",
    "ytmusicapi<=2.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
# 테스트가 backend/ 를 루트로 import 하도록 한다 (services, core, models …)
pythonpath = ["."]
testpaths  = ["tests"]
